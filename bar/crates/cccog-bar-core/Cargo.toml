[package]
name = "cccog-bar-core"
version = "0.1.0"
edition = "2021"
description = "Read-only CCCOG control graph parsing and aggregation core"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tempfile = "3"
