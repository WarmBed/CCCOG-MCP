[package]
name = "cccog-bar-quota"
version = "0.1.0"
edition = "2021"
description = "Read-only provider quota agents (Claude / Codex / Grok) with an injected HTTP boundary"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tempfile = "3"
