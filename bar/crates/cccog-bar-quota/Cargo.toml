[package]
name = "cccog-bar-quota"
version = "0.1.0"
edition = "2021"
description = "Read-only provider quota agents (Claude / Codex / Grok) with an injected HTTP boundary"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Task 18 (2026-08-18): Windows Credential Manager read (CredReadW) for the
# Claude OAuth blob. `windows-sys` 0.61 is already present in the workspace's
# own dependency graph (pulled in transitively elsewhere) — pinning to the
# same version here adds no new download/compile weight to the tree.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
tempfile = "3"
